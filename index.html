function calc(){const m=MS[S.m],q=S.q,u=S.up,bus=u.gra?95:120,cap=m.cap+(u.grt?40:0);let cost=0,mass=bus,w=0,gen=0,rtg=u.kil?200:0,sk=0,comm=0,isp=0,mx=0;
